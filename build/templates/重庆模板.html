<!DOCTYPE html>
<!-- saved from url=(0059)https://www.chuanhuayun.top/uploads/cert_68934c84e2338.html -->
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${user.name}的健康证|"></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .fc {
            color: rgb(4, 4, 130);
            font-weight: bold;
            font-size: 14px;
        }

        .f1 {
            color: #000;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
        }

        .dis {
            display: flex;
            justify-content: space-between;
        }

        .health-certificate {
            background: #f8f8f8;
            margin: 0 auto;
            width: 414px;
            padding: 20px 0;
        }

        .cert-card {
            background: #fff;
            margin: 0 20px 20px;
            border: 2px solid #333;
            border-radius: 14px;
        }

        .cert-header {
            padding: 8px 0;
            text-align: center;
            font-size: 16px;
            border-bottom: 2px solid rgb(48, 42, 155);
        }

        .cert-content {
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        .cert-info {
            padding: 10px 0;
        }

        .cert-info-row {
            margin-bottom: 10px;
        }

        .stamp-container {
            position: absolute;
            left: 150px;
            bottom: 0;
            z-index: 1;
        }

        .photo-container {
            position: absolute;
            right: 12px;
            top: 10px;
            z-index: 1;
        }

        .cert-footer {
            width: 100%;
            height: 2px;
            background: rgb(48, 42, 155);
            margin-bottom: 2px;
        }

        .issuer-info {
            padding: 6px 0;
            text-align: center;
            font-size: 13px;
            border-bottom: 2px solid rgb(48, 42, 155);
            color: #fff;
            background: rgb(41, 45, 153);
            border-radius: 0 0 12px 12px;
        }

        .explanation-card {
            background: #fff;
            margin: 0 20px 20px;
            border: 2px solid #333;
            border-radius: 14px;
        }

        .explanation-content {
            padding: 0 20px;
        }

        .explanation-section {
            margin-bottom: 15px;
        }

        .explanation-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo-qr-container {
            width: 80px;
            height: 80px;
            background: transparent;
            padding: 0px;
            border: 0px solid #ddd;
            margin-left: -8px;
            margin-right: 8px;
            position: relative;
            top: -5px;
        }

        .qrcode-img {
            width: 80px !important;
            height: 80px !important;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .old-qr-container {
            display: none;
        }
    </style>
</head>
<body>
<div class="health-certificate">
    <div class="cert-card">
        <div class="cert-header fc">重庆市从业人员健康合格证明</div>
        <div class="cert-content">
            <div class="cert-info">
                <div class="cert-info-row">
                    <div class="dis" style="width:220px;">
                        <div>
                            <span class="fc">工种：</span>
                            <span class="f1">食品卫生</span>
                        </div>
                        <div>
                            <span class="fc">性别：</span>
                            <span class="f1" th:text="${user.sex}"></span>
                        </div>
                    </div>
                </div>
                <div class="cert-info-row">
                    <div class="dis" style="width:220px;">
                        <div>
                            <span class="fc">姓名：</span>
                            <span class="f1" th:text="${user.name}"></span>
                        </div>
                        <div>
                            <span class="fc">年龄：</span>
                            <span class="f1" th:text="${user.age}"></span>
                        </div>
                    </div>
                </div>
                <div class="cert-info-row">
                    <div class="dis">
                        <div>
                            <span class="fc">编号：</span>
                            <span class="f1" th:text="${user.nameId}"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div style="display:flex;">
                <!-- 二维码容器 -->
                <div class="logo-qr-container">
                    <!-- 二维码 -->
                    <img class="qrcode-img"
                         th:src="'data:image/png;base64,'+${user.jkzQrCode}"
                         alt="高清二维码" style="width:80px;height:80px;">
                </div>
                <div style="display:flex;flex-direction: column;justify-content: space-around;margin-left:10px;">
                    <div>
                        <span class="fc">体检日期：</span>
                        <span class="f1" th:text="${user.jkzCreateData}"></span>
                    </div>
                    <div>
                        <span class="fc">有效期一年</span>
                    </div>
                    <div>
                        <span class="fc">身份证号：</span>
                        <span class="f1" th:text="${user.nameId}"></span>
                    </div>
                </div>
            </div>
